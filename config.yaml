baseURL: "https://bbokser.github.io/"
disablePathToLower: true
languageCode: en-us
title: Ben Bokser's Blog
theme: ["PaperMod"]
# publishDir: docs

pagination:
  disableAliases: false
  pagerSize: 25
  path: page

minify:
    disableXML: true
    minifyOutput: true
    
# params:
#   fullWidthTheme: false
#   centerTheme: true

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
mainsections: ["posts", "papermod"]

params:
    # homeInfoParams:
    #   Title: Welcome!
    #   Content: Hi! I'm Ben Bokser, and this is my blog. Have fun.
    env: production # to enable google analytics, opengraph, twitter-cards and schema.
    description: "Ben Bokser's Blog"
    author: Ben Bokser
    title: Ben Bokser's Blog
    DateFormat: "January 2, 2006"
    customCSS: /style.css
    justifyContent: true
    defaultTheme: auto
    # disableThemeToggle: true
    ShowShareButtons: true
    ShowReadingTime: false
    displayFullLangName: true
    ShowPostNavLinks: true
    ShowBreadCrumbs: true
    ShowCodeCopyButtons: true
    ShowRssButtonInSectionTermList: true
    ShowToc: true
    comments: true
    math: true
    enableEmoji: true
    disableSpecial1stPost: true  # if set to false, top post looks different
    disableScrollToTop: false
    hidemeta: false
    hideSummary: false
    showtoc: true 
    tocopen: false
    hideAuthor: true
    # disqusShortname: ben_bokser
    # ShowFullTextinRSS: true https://medium.com/@ericapisani/setting-up-an-rss-feed-for-a-hugo-blog-using-the-papermod-theme-a141b3fa1ccd

    assets:
        disableHLJS: true # to disable highlight.js
        # disableFingerprinting: true
        favicon: "/favicon.ico"
        favicon16x16:  "/favicon-16x16.png"
        favicon32x32:  "/favicon-32x32.png"
        apple_touch_icon:  "/apple-touch-icon.png"
        safari_pinned_tab:  "/safari-pinned-tab.svg"
    label:
        text: "Ben Bokser's Blog"
        # icon: ":deciduous_tree:" 
        iconHeight: 35

    socialIcons:
        - name: github
          url: "https://github.com/bbokser"
        - name: linkedin
          url: "https://www.linkedin.com/in/ben-bokser/"
        - name: youtube
          url: "https://www.youtube.com/@bbokser"
        - name: rss
          url: "https://bbokser.github.io/index.xml"
        - name: googlescholar
          url: "https://scholar.google.com/citations?user=q0ePecsAAAAJ&hl=en&oi=ao"

    cover:
        hidden: false # hide everywhere but not in structured data
        hiddenInList: false # hide on list pages and home
        hiddenInSingle: true # hide on single page

    editPost:
        URL: https://github.com/bbokser/bbokser.github.io/tree/main/content
        Text: "Suggest Changes" # edit text
        appendFilePath: true # to append file path to Edit link

    # for search
    # https://fusejs.io/api/options.html
    fuseOpts:
        isCaseSensitive: false
        shouldSort: true
        location: 0
        distance: 1000
        threshold: 0.4
        minMatchCharLength: 0
        keys: ["title", "permalink", "summary", "content"]

outputs:
    home:
        - HTML
        - RSS
        - JSON # is necessary


menu:
    main:
        - name: Posts 
          url: /
          weight: 1
        - name: Tags
          url: /tags/
          weight: 2
        - name: Archive 
          url: /archives/
          weight: 3
        - name: About
          url: /about/
          weight: 4
        - name: Projects
          url: /projects/
          # url: https://benbokser.com/
          weight: 5
        
 
# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
# pygmentsUseClasses: true
markup:
    highlight:
        # anchorLineNos: true
        codeFences: true
        guessSyntax: true
        # lineNos: true
        style: monokai

ignoreLogs: 'warning-goldmark-raw-html'